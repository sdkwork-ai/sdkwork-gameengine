version: 2
defaultProfile: cloud.production
profiles:
  cloud.test:
    deployment:
      deploymentProfile: cloud
      environment: test
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: gameengine-test.sdkwork.com
        tls: sdkwork.com
        mode: api
      - domain: gameengine-test.birdcoder.com
        tls: birdcoder.com
        mode: api
      - domain: gameengine-test.dtupay.com
        tls: dtupay.com
        mode: api
      - domain: gameengine-test.sdkwork.cn
        tls: sdkwork.cn
        mode: api
      - domain: gameengine-test.birdcoder.cn
        tls: birdcoder.cn
        mode: api
      - domain: gameengine-test.dtupay.cn
        tls: dtupay.cn
        mode: api
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.test
        env: etc/topology/cloud.test.env
      proxy:
        upstreams:
          application.public-ingress: https://gameengine-test.sdkwork.com
          platform.api-gateway: https://api-test.sdkwork.com
      kubernetes:
        reference: deployments/kubernetes/
  cloud.staging:
    deployment:
      deploymentProfile: cloud
      environment: staging
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: gameengine-staging.sdkwork.com
        tls: sdkwork.com
        mode: api
      - domain: gameengine-staging.birdcoder.com
        tls: birdcoder.com
        mode: api
      - domain: gameengine-staging.dtupay.com
        tls: dtupay.com
        mode: api
      - domain: gameengine-staging.sdkwork.cn
        tls: sdkwork.cn
        mode: api
      - domain: gameengine-staging.birdcoder.cn
        tls: birdcoder.cn
        mode: api
      - domain: gameengine-staging.dtupay.cn
        tls: dtupay.cn
        mode: api
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.staging
        env: etc/topology/cloud.staging.env
      proxy:
        upstreams:
          application.public-ingress: https://gameengine-staging.sdkwork.com
          platform.api-gateway: https://api-staging.sdkwork.com
      kubernetes:
        reference: deployments/kubernetes/
  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: gameengine.sdkwork.com
        tls: sdkwork.com
        mode: api
      - domain: gameengine.birdcoder.com
        tls: birdcoder.com
        mode: api
      - domain: gameengine.dtupay.com
        tls: dtupay.com
        mode: api
      - domain: gameengine.sdkwork.cn
        tls: sdkwork.cn
        mode: api
      - domain: gameengine.birdcoder.cn
        tls: birdcoder.cn
        mode: api
      - domain: gameengine.dtupay.cn
        tls: dtupay.cn
        mode: api
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.production
        env: etc/topology/cloud.production.env
      proxy:
        upstreams:
          application.public-ingress: https://gameengine.sdkwork.com
          platform.api-gateway: https://api.sdkwork.com
      kubernetes:
        reference: deployments/kubernetes/
  standalone.production:
    deployment:
      deploymentProfile: standalone
      environment: production
      deliveryKind: host-package
      deploymentDriver: nginx
      managementModel: customer-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: private
      rolloutStrategy: recreate
      availabilityMode: single-instance
    install:
      layout: binary-package
    expose:
      - tls: sdkwork.com
        mode: web
        web: adaptive
        domain: gameengine.sdkwork.com
      - tls: birdcoder.com
        mode: web
        web: adaptive
        domain: gameengine.birdcoder.com
      - tls: dtupay.com
        mode: web
        web: adaptive
        domain: gameengine.dtupay.com
      - tls: sdkwork.cn
        mode: web
        web: adaptive
        domain: gameengine.sdkwork.cn
      - tls: birdcoder.cn
        mode: web
        web: adaptive
        domain: gameengine.birdcoder.cn
      - tls: dtupay.cn
        mode: web
        web: adaptive
        domain: gameengine.dtupay.cn
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: standalone.production
        env: etc/topology/standalone.production.env
      allowInsecureTls: true
