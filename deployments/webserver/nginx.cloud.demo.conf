# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/gameengine/webserver.pid;
error_log /var/log/sdkwork/gameengine/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name gameengine-demo.sdkwork.com gameengine-demo.birdcoder.com gameengine-demo.dtupay.com gameengine-demo.noaper.com gameengine-demo.sdkwork.cn gameengine-demo.birdcoder.cn gameengine-demo.dtupay.cn gameengine-demo.noaper.cn gameengine-demo.skubc.com gameengine-demo.skubc.cn gameengine-demo.zowalk.com gameengine-demo.zowalk.cn gameengine-demo.offer86.com gameengine-demo.offer86.cn gameengine-demo.86offer.com gameengine-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/gameengine/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
