# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/gameengine/webserver.pid;
error_log /var/log/sdkwork/gameengine/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name gameengine-dev.sdkwork.com gameengine-dev.birdcoder.com gameengine-dev.dtupay.com gameengine-dev.noaper.com gameengine-dev.sdkwork.cn gameengine-dev.birdcoder.cn gameengine-dev.dtupay.cn gameengine-dev.noaper.cn gameengine-dev.skubc.com gameengine-dev.skubc.cn gameengine-dev.zowalk.com gameengine-dev.zowalk.cn gameengine-dev.offer86.com gameengine-dev.offer86.cn gameengine-dev.86offer.com gameengine-dev.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/gameengine/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
