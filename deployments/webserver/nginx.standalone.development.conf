# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/gameengine/webserver.pid;
error_log /var/log/sdkwork/gameengine/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name gameengine-dev.sdkwork.com gameengine-dev.birdcoder.com gameengine-dev.dtupay.com gameengine-dev.sdkwork.cn gameengine-dev.birdcoder.cn gameengine-dev.dtupay.cn gameengine-dev.skubc.com gameengine-dev.skubc.cn gameengine-dev.zowalk.com gameengine-dev.zowalk.cn gameengine-dev.offer86.com gameengine-dev.offer86.cn gameengine-dev.86offer.com gameengine-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
