# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/gameengine/webserver.pid;
error_log /var/log/sdkwork/gameengine/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name gameengine-staging.sdkwork.com gameengine-staging.birdcoder.com gameengine-staging.dtupay.com gameengine-staging.noaper.com gameengine-staging.sdkwork.cn gameengine-staging.birdcoder.cn gameengine-staging.dtupay.cn gameengine-staging.noaper.cn gameengine-staging.skubc.com gameengine-staging.skubc.cn gameengine-staging.zowalk.com gameengine-staging.zowalk.cn gameengine-staging.offer86.com gameengine-staging.offer86.cn gameengine-staging.86offer.com gameengine-staging.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/gameengine/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
